<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Entrar | WACKERBAUER</title><link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-page">
    <header class="site-header">
      <nav class="navbar container">
        <a class="brand" href="index.html">WACKERBAUER</a>
        <a class="back-link" href="index.html">Volver a la tienda →</a>
      </nav>
    </header>
    <main class="auth-layout container">
      <section class="auth-intro">
        <p class="eyebrow">Tu espacio WACKERBAUER</p>
        <h1>Vuelve a lo que <em>te mueve.</em></h1>
        <p>Guarda tus favoritos, consulta tus pedidos y disfruta de una experiencia hecha para ti.</p>
      </section>
      <section class="auth-panel" aria-labelledby="auth-heading">
        <div class="auth-panel-heading">
          <h2 id="auth-heading">Tu cuenta</h2>
          <p>Inicia sesión o crea una cuenta para guardar tus favoritos y consultar tus pedidos.</p>
        </div>
        <div class="auth-tabs">
          <button class="auth-tab active" type="button" data-auth-tab="login">Iniciar sesión</button>
          <button class="auth-tab" type="button" data-auth-tab="register">Crear cuenta</button>
        </div>
        <form id="login-form" class="auth-form">
          <label>Email<input name="email" type="email" placeholder="tu@email.com" autocomplete="email" required /></label>
          <label>Contraseña<input name="password" type="password" placeholder="••••••••" autocomplete="current-password" required /></label>
          <a class="forgot-link" href="#">¿Has olvidado tu contraseña?</a>
          <button class="button button-dark" type="submit">Entrar <span>→</span></button>
        </form>
        <form id="register-form" class="auth-form hidden">
          <label>Nombre<input name="username" type="text" placeholder="Tu nombre" autocomplete="name" minlength="2" maxlength="60" required /></label>
          <label>Email<input name="email" type="email" placeholder="tu@email.com" autocomplete="email" required /></label>
          <label>Contraseña<input name="password" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required /></label>
          <button class="button button-dark" type="submit">Crear cuenta <span>→</span></button>
        </form>
        <p id="auth-message" class="form-message" role="status"></p>
      </section>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
